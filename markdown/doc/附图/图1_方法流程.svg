    <text x="735" y="666">S105 从实际失败记录</text>
    <text x="735" y="703">生成定向补证请求</text>
    <text x="300" y="866">S106 综合校验通过，</text>
    <text x="300" y="900">属于最终阶段，</text>
    <text x="300" y="934">n ≥ N 且未策略阻断？</text>
    <text x="735" y="885">不执行本次规则</text>
    <text x="735" y="920">自动提交</text>
    <text x="300" y="1089">写入采集规则及对应工作流记忆</text>
