  <g font-family="Microsoft YaHei,SimSun,sans-serif" font-size="23" fill="black" text-anchor="middle">
    <text x="300" y="70">S101 获取字段规范、规则与记录</text>
    <text x="300" y="108">取得阶段标识及实际输出总数 N</text>
    <text x="300" y="216">S102 归一化网页地址</text>
    <text x="300" y="251">按路由分层标识划分记录</text>
    <text x="300" y="356">S103 逐分层、逐必填字段</text>
    <text x="300" y="391">计算空值比例并判定失败</text>
    <text x="300" y="496">S104 生成分层字段校验记录</text>
    <text x="300" y="531">保留观察范围、校验数 n 和失败总数</text>
